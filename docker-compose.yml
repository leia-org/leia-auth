services:
  mongodb-auth:
    restart: unless-stopped
    image: mongo:latest
    container_name: mongodb-auth
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password123}
    ports:
      - '${MONGO_PORT:-27019}:27017'
    volumes:
      - mongo-auth:/data/db

  auth:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leia-auth
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://admin:password123@mongodb-auth:27017/auth?authSource=admin}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@leiaorg.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-secret}
      - API_KEY_STORAGE_SECRET=${API_KEY_STORAGE_SECRET:-13af25e58655f106648d94972678da29d6cce43bb40a48f1ed049adcff962be6}
      - PORT=80
      - NODE_ENV=${NODE_ENV:-develop}
      - JWT_SECRET=${JWT_SECRET:-secret}
      - API_KEY=${API_KEY:-secret}
      - RUNNER_URL=${RUNNER_URL:-http://localhost:5002}
      - RUNNER_KEY=${RUNNER_KEY:-R2D2C3PO}
      - WORKBENCH_FRONTEND_URL=${WORKBENCH_FRONTEND_URL:-http://localhost:8080}
      - DESIGNER_FRONTEND_URL=${DESIGNER_FRONTEND_URL:-http://localhost:5173}
      - INTERN_TOKEN=${INTERN_TOKEN:-secret_intern_token}
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-false}
      - CLOUDFLARE_SECRET_KEY=${CLOUDFLARE_SECRET_KEY:-}
    depends_on:
      - mongodb-auth
    ports:
      - '${PORT:-3005}:80'

volumes:
  mongo-auth:
