parameters:
  - in: path
    name: id
    required: true
    schema:
      $ref: '../../../components/schemas/mongoId.yaml'
put:
  tags:
    - API Keys v1
  summary: Update a system API key
  description: Updates a shared system API key and notifies Runner about revocation. Requires admin access.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/v1/apiKey/updateApiKey.yaml'
  responses:
    '200':
      description: System API key updated.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/apiKey/apiKey.yaml'
    '400':
      description: Validation or provider verification error.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/apiKey/apiKeyValidationError.yaml'
    '403':
      description: Admin access required.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/error.yaml'
    '404':
      description: System API key not found.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/apiKey/systemApiKeyNotFoundError.yaml'
delete:
  tags:
    - API Keys v1
  summary: Delete a system API key
  description: Deletes a shared system API key and removes it from all users. Requires admin access.
  security:
    - bearerAuth: []
  responses:
    '204':
      description: System API key deleted.
    '403':
      description: Admin access required.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/error.yaml'
    '404':
      description: System API key not found.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/apiKey/systemApiKeyNotFoundError.yaml'
