put:
  tags:
    - Users v1
  summary: Change current user password
  description: Changes the password of the authenticated user.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/v1/user/changePassword.yaml'
  responses:
    '200':
      description: Password changed.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/user/messageResponse.yaml'
    '400':
      description: Invalid current password or password payload.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/error.yaml'
    '401':
      description: Login required.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/error.yaml'
    '404':
      description: User not found.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/userNotFoundError.yaml'
