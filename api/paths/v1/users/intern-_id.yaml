parameters:
  - in: path
    name: id
    required: true
    schema:
      $ref: '../../../components/schemas/mongoId.yaml'
get:
  tags:
    - Users v1
  summary: Get user by id for internal services
  description: Returns a user by id using the internal service token.
  security:
    - internTokenAuth: []
  responses:
    '200':
      description: User found.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/user/user.yaml'
    '401':
      description: Invalid internal token.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/error.yaml'
    '404':
      description: User not found.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/userNotFoundError.yaml'
