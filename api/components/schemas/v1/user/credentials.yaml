type: object
properties:
  email:
    type: string
    format: email
    example: instructor@leia.local
  password:
    type: string
    format: password
    example: super-secret-password
  cf-turnstile-response:
    type: string
    description: Use the Cloudflare Turnstile response token. In local Swagger, use `swagger-turnstile-token`.
    example: swagger-turnstile-token
required:
  - email
  - password
  - cf-turnstile-response
